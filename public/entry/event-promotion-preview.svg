  <text x="34" y="261" fill="#52647c" font-family="Arial, sans-serif" font-size="12">A focused conversation for revenue leaders building</text>
  <text x="34" y="278" fill="#52647c" font-family="Arial, sans-serif" font-size="12">more useful, measurable buying experiences.</text>
  <rect x="34" y="307" width="127" height="42" rx="21" fill="#0077ff"/>
