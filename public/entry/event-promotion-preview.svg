  <text x="620" y="32" fill="#52647c" font-family="Arial, sans-serif" font-size="10" font-weight="700">AGENDA</text>
  <rect x="34" y="82" width="112" height="34" rx="17" fill="#fff" stroke="#f1b8ab"/>
  <circle cx="53" cy="99" r="5" fill="#E85D45"/>
