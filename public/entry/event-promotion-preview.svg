<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title description">
  <title id="title">Event promotion experience preview</title>
  <desc id="description">A polished registration page preview with a date, event promise, speaker, and registration action.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff5f1"/>
    </linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16395f"/>
      <stop offset="1" stop-color="#071428"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#071428" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="720" height="380" fill="url(#canvas)"/>
  <rect x="0" y="0" width="720" height="52" fill="#fff"/>
  <path d="M0 51.5H720" stroke="#d7e7f2"/>
  <path d="M34 26c8-12 17-16 30-13-8 3-13 8-15 16 8-5 17-5 27 1-13 0-22 7-27 20-3-10-8-18-15-24Z" fill="#0077ff"/>
